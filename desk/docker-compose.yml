services:
  cdb:
    image: couchdb:3.5.2
    hostname: cdb
    environment:
      TERM: xterm-256color
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    volumes:
      - ./var/couchdb:/opt/couchdb/data
      # not :ro -- the image's entrypoint chowns everything under
      # /opt/couchdb under `set -e`, and a read-only mount makes it exit 1
      - ./docker/cdb/local.d/desk.ini:/opt/couchdb/etc/local.d/desk.ini
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"$$COUCHDB_USER:$$COUCHDB_PASSWORD\" http://localhost:5984/_up"]
      interval: 3s
      timeout: 3s
      retries: 20

  # serves desk_pad and rewrites /api/... onto the desk_drawer design doc --
  # CouchDB 3.x dropped the httpd_global_handlers/_rewrite machinery that used
  # to do both
  capi:
    image: nginx:1.30-alpine
    hostname: capi
    volumes:
      - ./docker/capi/conf.d:/etc/nginx/conf.d:ro
      - ../desk_pad:/opt/app/desk_pad:ro
      # Dev host only: add a docker-compose.override.yml next to this file
      # (git-ignored, compose loads it automatically) that bind-mounts the
      # Cappuccino checkouts under /opt/src -- desk_pad/Frameworks are symlinks
      # into there. The file to copy is in docs/upgrade-master-to-python3.md.
      # Production copies a release build into desk_pad/Frameworks and needs
      # no override file.
    ports:
      - "81:80"
    depends_on:
      cdb:
        condition: service_healthy

  dnsa:
    image: yvess/desk-dns:0.4.0
    hostname: ns1.localhost
    environment:
      TERM: xterm-256color
      PYTHONPATH: /opt/app
      COUCHDB_ADMIN: admin
      COUCHDB_ADMINPASS: admin
      COUCHDB_HOST: cdb
      COUCHDB_PORT: "5984"
      START_WORKER: "YES"
      START_PDNS: "YES"
      PDNS_API_KEY: desk
    volumes:
      - ..:/opt/app
      - ./var:/var/services
    working_dir: /opt/app/desk
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    depends_on:
      cdb:
        condition: service_healthy
    networks:
      default:
        # what the EXTRA_HOSTS/docker-link dance used to provide
        aliases:
          - ns1.localhost

  dnsb:
    image: yvess/desk-dns:0.4.0
    hostname: ns2.localhost
    environment:
      TERM: xterm-256color
      PYTHONPATH: /opt/app
      COUCHDB_ADMIN: admin
      COUCHDB_ADMINPASS: admin
      COUCHDB_HOST: cdb
      COUCHDB_PORT: "5984"
      START_WORKER: "YES"
      START_PDNS: "YES"
      PDNS_API_KEY: desk
    volumes:
      - ..:/opt/app
      - ./var:/var/services
    working_dir: /opt/app/desk
    ports:
      - "2053:53/udp"
      - "2053:53/tcp"
    depends_on:
      cdb:
        condition: service_healthy
    networks:
      default:
        aliases:
          - ns2.localhost

  foreman:
    image: yvess/desk-worker:0.4.0
    hostname: foreman
    environment:
      TERM: xterm-256color
      PYTHONPATH: /opt/app
      COUCHDB_ADMIN: admin
      COUCHDB_ADMINPASS: admin
      COUCHDB_HOST: cdb
      COUCHDB_PORT: "5984"
      START_WORKER: "YES"
    volumes:
      - ..:/opt/app
      - ./var:/var/services
    working_dir: /opt/app/desk
    depends_on:
      cdb:
        condition: service_healthy
      dnsa:
        condition: service_started
      dnsb:
        condition: service_started
