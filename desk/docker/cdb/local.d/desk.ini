; Single-node CouchDB for the desk dev stack. The admin account comes from the
; official image's COUCHDB_USER/COUCHDB_PASSWORD, which it writes to its own
; local.d/docker.ini -- don't duplicate it here.

[couchdb]
; create _users/_replicator/_global_changes on first start
single_node = true

[cluster]
n = 1
q = 1

[chttpd]
bind_address = 0.0.0.0
require_valid_user = true
