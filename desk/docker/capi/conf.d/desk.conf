# desk API -> CouchDB. Every rule in the OpenResty rewrite_by_lua_block was a
# pure URI rewrite, so map + rewrite covers it without a scripting module.

# /api/<resource> -> the doc type the list_docs list function expects
map $desk_resource $desk_doc_type {
    default             "";
    clients             client;
    domains             domain;
    domains_by_client   domain_by_client;
    domains_by_name     domain_by_name;
    orders              order;
    service_definitions service_definition;
    services            service;
    services_by_client  service_by_client;
    templates           template;
    workers             worker;
}

# keep the client's own query string on collection GETs
map $args $desk_args {
    default "&$args";
    ""      "";
}

# the changes feed type stays overridable by the client
map $arg_feed $desk_feed {
    default $arg_feed;
    ""      eventsource;
}

upstream cdb {
    server cdb:5984;
}

server {
    listen *:80;
    server_name desk.docker capi;
    root /opt/app/desk_pad;

    access_log /var/log/desk.access.log;
    error_log  /var/log/desk.error.log error;

    # inherited by every location; the SSE _changes feeds raise it (desk_changes.inc)
    proxy_read_timeout 60;

    location = /api/_uuids {
        rewrite ^ /_uuids break;
        include conf.d/desk_proxy.inc;
    }

    location = /api/inspector_items {
        rewrite ^ /desk_drawer/_design/desk_drawer/_list/list_items/inspector_items break;
        include conf.d/desk_proxy.inc;
    }

    location ~ ^/api/showjson/(?<desk_doc_id>.+)$ {
        rewrite ^ /desk_drawer/_design/desk_drawer/_show/showjson/$desk_doc_id break;
        include conf.d/desk_proxy.inc;
    }

    location ~ ^/api/add-editor/(?<desk_doc_id>.+)$ {
        rewrite ^ /desk_drawer/_design/desk_drawer/_update/add-editor/$desk_doc_id break;
        include conf.d/desk_proxy.inc;
    }

    location ~ ^/api/(?<desk_feed_doc>tasks)/(?<desk_feed_state>open|done)/$ {
        include conf.d/desk_changes.inc;
    }

    location ~ ^/api/(?<desk_feed_doc>orders)/(?<desk_feed_state>open|new|done)/$ {
        include conf.d/desk_changes.inc;
    }

    # single document, any method
    location ~ ^/api/(?<desk_resource>[a-z_]+)/(?<desk_doc_id>[A-Za-z0-9_-]+)$ {
        if ($desk_doc_type = "") { return 404; }
        rewrite ^ /desk_drawer/$desk_doc_id break;
        include conf.d/desk_proxy.inc;
    }

    # collection: GET lists, POST creates
    location ~ ^/api/(?<desk_resource>[a-z_]+)$ {
        if ($desk_doc_type = "") { return 404; }
        if ($request_method = POST) {
            rewrite ^ /desk_drawer/ break;
        }
        rewrite ^ /desk_drawer/_design/desk_drawer/_list/list_docs/$desk_doc_type?include_docs=true$desk_args? break;
        include conf.d/desk_proxy.inc;
    }

    # the browser logs in against CouchDB itself: require_valid_user = true
    # makes every other route 401 until the AuthSession cookie is set
    location ~ ^/(_session|_users) {
        include conf.d/desk_proxy.inc;
    }

    location ~ ^/(desk_drawer|_uuids) {
        include conf.d/desk_proxy.inc;
    }
}
