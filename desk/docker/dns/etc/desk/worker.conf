[couchdb]
uri = http://-COUCHDB_ADMIN-:-COUCHDB_ADMINPASS-@-COUCHDB_HOST-:-COUCHDB_PORT-
db  = desk_drawer


[worker]
is_foreman = false
dns = powerdns:-HOSTNAME-


[powerdns]
; pdns runs in this container, so its API is on the loopback interface
api_url = http://127.0.0.1:8081
api_key = -PDNS_API_KEY-
