cache-ttl=60
distributor-threads=1
local-port=53
loglevel=3
negquery-cache-ttl=60
setgid=pdns
setuid=pdns
socket-dir=/var/run
# the worker drives pdns through this API; the key is templated by pdns-init
webserver=yes
webserver-address=127.0.0.1
webserver-allow-from=127.0.0.1/32
api=yes
disable-axfr=no
allow-axfr-ips=127.0.0.0/8,::1
version-string=powerdns
primary=yes
include-dir=/etc/powerdns/pdns.d
